name: Android widget
on:
  push:
    paths: ['android/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk liepa-widget.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-${{ github.run_number }}
          name: Liepa valdiklis ${{ github.run_number }}
          files: liepa-widget.apk
          make_latest: true
