plugins { id 'com.android.application' }
android {
    namespace 'lt.liepa.widget'
    compileSdk 34
    defaultConfig {
        applicationId 'lt.liepa.widget'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    signingConfigs {
        release {
            storeFile file('liepa-widget.keystore')
            storePassword 'liepa-widget'
            keyAlias 'liepa'
            keyPassword 'liepa-widget'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
