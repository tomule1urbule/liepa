<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liepa</title>
<meta name="theme-color" content="#f6f1ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#2a2622; --muted:#7c7268; --line:#e9e0d4; --soft:#f0e9df;
  --accent:#4f7a5a; --accent-ink:#fff;
  --feed:#d4834f; --sleep:#6476c0; --pump:#c0618a; --diaper:#3f9b97; --bath:#3d8fc4; --growth:#8a6fb8; --vacc:#b0884a;
  --warn:#b8662a; --good:#3f8752;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.05);
}
[data-theme="dark"]{
  --bg:#111315; --card:#1b1e21; --ink:#ece7e1; --muted:#9a938a; --line:#2a2e32; --soft:#22262a;
  --accent:#8fbf98; --accent-ink:#10140f;
  --feed:#eaa173; --sleep:#97a6ea; --pump:#e597b8; --diaper:#76c8c3; --bath:#7dbbe6; --growth:#b9a2e3; --vacc:#d9b37a;
  --warn:#e8a06a; --good:#8fcf9c;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;gap:10px}
header .who{flex:1;min-width:0}
header h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:27px;margin:0;line-height:1.1;letter-spacing:-.01em}
header .age{color:var(--muted);font-size:13.5px}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.sync{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.5;flex:none}
.sync.ok{background:var(--good);opacity:1}.sync.busy{background:var(--sleep);opacity:1;animation:pulse 1s infinite}.sync.err{background:var(--warn);opacity:1}
@keyframes pulse{50%{opacity:.3}}
h2{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:19px;margin:22px 2px 10px}
h2 small{font-family:Inter;font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card+.card{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* running timers */
.run{border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden;margin-top:10px}
.run.feed{background:linear-gradient(135deg,var(--feed),color-mix(in srgb,var(--feed) 70%,#000))}
.run.sleep{background:linear-gradient(135deg,var(--sleep),color-mix(in srgb,var(--sleep) 65%,#000))}
.run.pump{background:linear-gradient(135deg,var(--pump),color-mix(in srgb,var(--pump) 70%,#000))}
[data-theme="dark"] .run{color:#10120f}
.run.paused{filter:saturate(.35) brightness(.97)}
.run.paused .big{opacity:.6}
.run .lbl{font-weight:600;font-size:14px;opacity:.95;display:flex;gap:6px;align-items:center}
.run .big{font-family:Fraunces,Georgia,serif;font-size:46px;font-weight:650;letter-spacing:.01em;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.run .sub{font-size:13px;opacity:.9}
.run .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.run button{border:0;border-radius:12px;padding:10px 14px;font-weight:600;background:rgba(255,255,255,.22);color:inherit}
[data-theme="dark"] .run button{background:rgba(0,0,0,.18)}
.run button.stop{background:#fff;color:#2a2622}
[data-theme="dark"] .run button.stop{background:#10120f;color:#fff}
.sides{display:flex;gap:8px;margin-top:8px}
.sides div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:6px 10px;font-size:13px}
.sides div.on{background:rgba(255,255,255,.34);font-weight:600}
[data-theme="dark"] .sides div{background:rgba(0,0,0,.12)}[data-theme="dark"] .sides div.on{background:rgba(0,0,0,.25)}
.sides b{display:block;font-size:17px;font-variant-numeric:tabular-nums}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.q{border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600}
.q .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.q.feed .ic{background:color-mix(in srgb,var(--feed) 18%,transparent)}
.q.sleep .ic{background:color-mix(in srgb,var(--sleep) 18%,transparent)}
.q.pump .ic{background:color-mix(in srgb,var(--pump) 18%,transparent)}
.q.diaper .ic{background:color-mix(in srgb,var(--diaper) 18%,transparent)}
.q.active{outline:2px solid var(--sleep)}

/* since */
.since{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.since .card{padding:12px}
.since .k{font-size:12px;color:var(--muted);font-weight:500}
.since .v{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:650;line-height:1.2;margin-top:2px}
.since .d{font-size:12.5px;color:var(--muted)}

/* tips */
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ti{font-size:22px;line-height:1.2}
.tip p{margin:0}
.tip.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tip.good{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}

/* summary */
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 10px}
.sum .k{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sum .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .d{font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.feed{background:var(--feed)}.dot.sleep{background:var(--sleep)}.dot.pump{background:var(--pump)}.dot.diaper{background:var(--diaper)}

/* day bar */
.daybar{position:relative;height:34px;background:var(--soft);border-radius:10px;overflow:hidden;margin-top:6px}
.daybar .blk{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--sleep) 55%,transparent)}
.daybar .mk{position:absolute;width:3px;border-radius:2px}
.daybar .mk.feed{top:4px;bottom:4px;background:var(--feed)}
.daybar .mk.pump{top:10px;bottom:10px;background:var(--pump)}
.daybar .mk.bath{top:3px;height:6px;width:6px;border-radius:50%;background:var(--bath)}
.daybar .mk.diaper{bottom:3px;height:6px;width:6px;border-radius:50%;background:var(--diaper)}
.hours{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px;padding:0 1px}

/* history list */
.daynav{display:flex;align-items:center;gap:8px;margin-top:8px}
.daynav .t{flex:1;text-align:center;font-weight:600}
.item{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.item.feed .ic{background:color-mix(in srgb,var(--feed) 18%,transparent)}
.item.sleep .ic{background:color-mix(in srgb,var(--sleep) 18%,transparent)}
.item.pump .ic{background:color-mix(in srgb,var(--pump) 18%,transparent)}
.item.diaper .ic{background:color-mix(in srgb,var(--diaper) 18%,transparent)}
.item.bath .ic{background:color-mix(in srgb,var(--bath) 18%,transparent)}
.item.weight .ic{background:color-mix(in srgb,var(--growth) 18%,transparent)}
.item.vaccine .ic{background:color-mix(in srgb,var(--vacc) 20%,transparent)}
.more{display:flex;gap:8px;margin-top:8px}
.more button{flex:1;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:9px 4px;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px}
svg.wline{width:100%;height:150px;display:block;margin-top:8px}
.item .m{flex:1;min-width:0}
.item .tt{font-weight:600}
.item .dd{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tm{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:22px 8px}

/* stats */
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px;position:relative}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.chart .bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;min-height:2px}
.chart .val{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.chart .lb{font-size:11px;color:var(--muted)}
.chart .band{position:absolute;left:0;right:0;border-top:1.5px dashed color-mix(in srgb,var(--muted) 60%,transparent);border-bottom:1.5px dashed color-mix(in srgb,var(--muted) 60%,transparent);background:color-mix(in srgb,var(--muted) 7%,transparent);pointer-events:none}
.legend{font-size:12px;color:var(--muted);margin-top:6px}

/* tips page */
.hero{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 22%,var(--card)),var(--card));border-radius:20px;padding:16px;border:1px solid var(--line)}
.hero .w{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:650}
ul.nice{margin:6px 0 0;padding:0;list-style:none}
ul.nice li{padding:7px 0 7px 22px;position:relative;border-bottom:1px solid var(--line)}
ul.nice li:last-child{border-bottom:0}
ul.nice li:before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
ul.check li:before{content:"✓";background:none;color:var(--accent);top:6px;left:2px;width:auto;height:auto;font-weight:700}
.fact{font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.4}
table.g{width:100%;border-collapse:collapse;font-size:14px}
table.g td{padding:7px 2px;border-bottom:1px solid var(--line)}
table.g td:last-child{text-align:right;font-weight:600}
table.g tr:last-child td{border-bottom:0}
.disc{font-size:12px;color:var(--muted);margin:14px 4px 0}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet h3{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:21px;margin:2px 0 12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.big-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:14px 12px;text-align:left;font-weight:600;display:flex;flex-direction:column;gap:2px}
.opt span{font-weight:400;font-size:12.5px;color:var(--muted)}
.opt.sug{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.opt.wide{grid-column:1/-1}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.in,select.in,textarea.in{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.in:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;background:var(--soft);flex:1}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.del{background:none;color:var(--warn);flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:#2a2622;color:#fff;padding:11px 14px;border-radius:14px;z-index:30;transition:.2s;display:flex;gap:14px;align-items:center;max-width:92vw;font-size:14px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:#ffcfa8;font-weight:700;padding:0}
.hide{display:none!important}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
code.k{font-size:12px;background:var(--soft);padding:2px 6px;border-radius:6px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="who">
      <h1 id="hName">Liepa</h1>
      <div class="age" id="hAge"></div>
    </div>
    <span class="sync" id="syncDot" title="Sinchronizacija"></span>
    <button class="iconbtn" id="setBtn" aria-label="Nustatymai">⚙︎</button>
  </header>

  <main id="pg-home"></main>
  <main id="pg-hist" class="hide"></main>
  <main id="pg-stats" class="hide"></main>
  <main id="pg-tips" class="hide"></main>
</div>

<nav><div class="in">
  <button data-pg="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Šiandien</button>
  <button data-pg="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Istorija</button>
  <button data-pg="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Statistika</button>
  <button data-pg="tips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4-3-8-6.5-8-11a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 4.5-4 8-8 11z"/></svg>Patarimai</button>
</div></nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn"></button></div>

<script>
"use strict";
/* =========================================================
   Helpers
   ========================================================= */
const $ = s => document.querySelector(s);
const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,"0");
function pl(n, f){ n = Math.abs(Math.round(n)); const a=n%10, b=n%100;
  if(a===1 && b!==11) return f[0]; if(a>=2 && a<=9 && !(b>=12 && b<=19)) return f[1]; return f[2]; }
const dots = x => String(x).replace(/\.(<\/b>)?\./g, ".$1");
function hm(ms){ return new Date(ms).toLocaleTimeString("lt-LT",{hour:"2-digit",minute:"2-digit"}); }
function dur(ms, short){ ms = Math.max(0, ms); const m = Math.round(ms/MIN); const h = Math.floor(m/60), mm = m%60;
  if(h >= 24){ const dd = Math.floor(h/24), hh = h%24; return hh ? `${dd} d. ${hh} val.` : `${dd} d.`; }
  if(h && mm) return `${h} val. ${mm} min.`; if(h) return `${h} val.`; return `${mm} min.`; }
function hhmm(ms){ ms=Math.max(0,ms); const m=Math.round(ms/MIN); return `${Math.floor(m/60)}:${pad(m%60)}`; }
function clock(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; }
function dayStart(ms){ const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function addDays(ms, n){ const d=new Date(ms); d.setDate(d.getDate()+n); return d.getTime(); }
function toInput(ms){ const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fromInput(v){ return v ? new Date(v).getTime() : null; }
function dayTitle(ms){
  const t = dayStart(Date.now());
  if(ms===t) return "Šiandien"; if(ms===addDays(t,-1)) return "Vakar";
  const x = new Date(ms).toLocaleDateString("lt-LT",{weekday:"long",month:"long",day:"numeric"});
  return x.charAt(0).toUpperCase() + x.slice(1);
}
const WD = ["Sk","Pr","An","Tr","Kt","Pn","Št"];

/* =========================================================
   State
   ========================================================= */
let entries = LS.get("lp_entries", {});          // id -> entry
let queue   = LS.get("lp_queue", []);            // pending entries to push
let cfg     = LS.get("lp_cfg", {url:"", key:""});
let since   = LS.get("lp_since", 0);
let who     = LS.get("lp_who", "");
let theme   = LS.get("lp_theme", "auto");
let page    = "home";
let histDay = dayStart(Date.now());

const DEFAULT_BABY = {name:"Liepa", birth:"2026-07-26"};
function baby(){ const c = entries.cfg; return Object.assign({}, DEFAULT_BABY, c && !c.x ? c.d : {}); }
function list(){ return Object.values(entries).filter(e => !e.x && e.t!=="cfg"); }
function running(){ return list().filter(e => e.e==null && e.t!=="diaper").sort((a,b)=>a.s-b.s); }
function saveLocal(){ LS.set("lp_entries", entries); LS.set("lp_queue", queue); }

function put(e){
  e.u = Date.now(); if(!e.by) e.by = who || "";
  entries[e.id] = e;
  queue = queue.filter(id => id!==e.id); queue.push(e.id);
  saveLocal(); render(); sync();
}
function remove(e){ const old = JSON.parse(JSON.stringify(e)); e.x = 1; put(e);
  toast("Įrašas ištrintas", "Atšaukti", () => { delete old.x; put(old); }); }

/* =========================================================
   Age & guidelines
   ========================================================= */
function age(at = Date.now()){
  const b = new Date(baby().birth + "T00:00:00"); const n = new Date(at); n.setHours(0,0,0,0);
  const days = Math.max(0, Math.round((n - b)/DAY));
  let months = (n.getFullYear()-b.getFullYear())*12 + (n.getMonth()-b.getMonth());
  if(n.getDate() < b.getDate()) months--;
  months = Math.max(0, months);
  const anchor = new Date(b); anchor.setMonth(anchor.getMonth()+months);
  const mdays = Math.round((n - anchor)/DAY);

  if(sug && !feeding) tips.push({i:"🤱", x:`Kitą maitinimą siūloma pradėti nuo <b>${SIDE_GEN[sug]}</b> krūties.`});

  // Last night
  const t0 = dayStart(now), nl = nightLongest(t0);
  if(nl && new Date().getHours() < 14){
    const prev = [1,2,3,4,5,6,7].map(i=>nightLongest(addDays(t0,-i))).filter(Boolean);
    const avg = prev.length ? prev.reduce((a,b)=>a+b,0)/prev.length : 0;
    if(avg && nl - avg > 30*MIN) tips.push({c:"good", i:"🎉", x:`Praėjusią naktį ilgiausiai miegojo be pertraukos <b>${dur(nl)}</b> – ${dur(nl-avg)} ilgiau nei savaitės vidurkis!`});
    else tips.push({i:"🌜", x:`Ilgiausias praėjusios nakties miegas – <b>${dur(nl)}</b>${avg?` (savaitės vidurkis ${dur(avg)})`:""}.`});
  }
  // Yesterday sleep total vs norm (only if logging looks complete)
  const y = dayStats(addDays(t0,-1));
  if(y.sleeps.length >= 3){
    const h = y.sleepMs/HOUR;
    if(h < N.sleep[0]-0.5) tips.push({c:"warn", i:"🛌", x:`Vakar ji miegojo <b>${dur(y.sleepMs)}</b> – mažiau nei įprasta jos amžiui (${N.sleep[0]}–${N.sleep[1]} val.). Pervargęs kūdikis kartais miega dar prasčiau, todėl gali padėti kiek ankstesnis migdymas.`});
    else if(h <= N.sleep[1]+0.5) tips.push({c:"good", i:"✨", x:`Vakar ji miegojo <b>${dur(y.sleepMs)}</b> – tiek, kiek rekomenduojama jos amžiui (${N.sleep[0]}–${N.sleep[1]} val.).`});
  }
  // Pumping
  const tdy = dayStats(t0);
  const p7 = [1,2,3,4,5,6,7].map(i=>dayStats(addDays(t0,-i)).pumpMl);
  const pDays = p7.filter(Boolean);
  if(pDays.length || tdy.pumpMl){
    const avg = pDays.length ? Math.round(pDays.reduce((a,b)=>a+b,0)/pDays.length) : 0;
    tips.push({i:"🥛", x:`Šiandien nutraukta <b>${tdy.pumpMl} ml</b>${avg?`, vidutiniškai per dieną – ${avg} ml (paskutinių ${pDays.length} d.)`:""}. Pieno kiekiui palaikyti padeda reguliarumas.`});
  }
  // Diapers for young babies
  if(a.weeks < 8 && tdy.diapers.length && new Date().getHours() >= 17 && tdy.wet < 4)
    tips.push({c:"warn", i:"💧", x:`Šiandien pažymėtos tik ${tdy.wet} šlapios sauskelnės. Per parą jų turėtų būti bent 6 – jei mažiau, pasitarkite su gydytoju.`});
  return tips;
}

function daysAgo(ms){ const d = Math.round((dayStart(Date.now()) - dayStart(ms))/DAY);
  return d<=0 ? "šiandien" : d===1 ? "vakar" : `prieš ${d} ${pl(d,["dieną","dienas","dienų"])}`; }
function fmtKg(g){ return (g/1000).toFixed(2).replace(".",",") + " kg"; }
function pumpMl(p){ return (+p.d?.l||0)+(+p.d?.r||0)+(+p.d?.ml||0); }
function dayBar(d0){
  const d1 = addDays(d0,1), now = Date.now(), L = list(), pct = t => ((t-d0)/DAY*100).toFixed(2);
  let h = "";
  L.filter(e=>e.t==="sleep" && inRange(e,d0,d1)>0).forEach(e=> segs(e).forEach(([x,y])=>{
    const a = Math.max(x,d0), b = Math.min(y, d1); if(b<=a) return;
    h += `<div class="blk" style="left:${pct(a)}%;width:${((b-a)/DAY*100).toFixed(2)}%"></div>`;
  }));
  L.filter(e=>e.t!=="sleep" && e.t!=="weight" && e.t!=="vaccine" && e.s>=d0 && e.s<d1).forEach(e=> h += `<div class="mk ${e.t}" style="left:${pct(e.s)}%"></div>`);
  return `<div class="daybar">${h}</div><div class="hours"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>`;
}

function describe(e){
  const d = e.d||{};
  if(e.t==="feed"){
    if(d.m==="breast"){ const bt = breastTimes(e);
      return {t:"Maitinimas krūtimi", d:[bt.l?`K ${dur(bt.l)}`:"", bt.r?`D ${dur(bt.r)}`:""].filter(Boolean).join(" · ") || SIDE[d.side]}; }
    if(d.m==="bottle") return {t:"Buteliukas", d:`${d.ml||"?"} ml · ${d.milk==="formula"?"mišinys":d.milk==="mix"?`${+d.bm||0} pienas + ${+d.fm||0} mišinys`:"motinos pienas"}`};
    return {t:"Papildomas maistas", d:d.food||""};
  }
  if(e.t==="sleep"){ const pz = pauseMs(e), n = pauses(e).length;
    return {t:d.k==="night"?"Nakties miegas":"Pogulis", d:(e.e?dur(activeMs(e)):paused(e)?"pauzė":"vyksta")+(n&&pz>=MIN?` · ${n} ${pl(n,["pabudimas","pabudimai","pabudimų"])} (${dur(pz)})`:"")}; }
  if(e.t==="pump") return {t:"Pieno nutraukimas", d:`${pumpMl(e)} ml${d.l||d.r?` (K ${d.l||0} · D ${d.r||0})`:""}${e.e&&activeMs(e)>=MIN?` · ${dur(activeMs(e))}`:""}`};
  if(e.t==="diaper") return {t:"Sauskelnės", d:[d.w?"šlapios":"", d.p?"purvinos":""].filter(Boolean).join(" ir ")||"sausos"};
  if(e.t==="bath") return {t:"Maudynės", d:""};
  if(e.t==="weight") return {t:"Svoris ir ūgis", d:[+d.g?fmtKg(d.g):"", +d.h?`${String(d.h).replace(".",",")} cm`:"", +d.hc?`galva ${String(d.hc).replace(".",",")} cm`:""].filter(Boolean).join(" · ")};
  if(e.t==="vaccine") return {t:"Skiepas", d:d.name||""};
  return {t:e.t, d:""};
}

function render(){

function tick(){
  const now = Date.now();
  document.querySelectorAll(".tick").forEach(el => { const e = entries[el.dataset.id]; if(e) el.textContent = clock(activeMs(e)); });
  document.querySelectorAll(".ptick").forEach(el => el.textContent = clock(now - +el.dataset.p));
  document.querySelectorAll(".ago").forEach(el => el.textContent = dur(now - +el.dataset.t));
  document.querySelectorAll(".run.feed").forEach(c => { const e = entries[c.dataset.id]; if(!e) return; const bt = breastTimes(e);
    c.querySelector(".tickL").textContent = clock(bt.l); c.querySelector(".tickR").textContent = clock(bt.r); });
}
setInterval(tick, 1000);
setInterval(() => { if(!$("#scrim").classList.contains("show")) render(); }, 60e3);

/* =========================================================
   Actions
   ========================================================= */
function startFeed(side){
  running().filter(e=>e.t==="feed").forEach(stopEntry);
  const now = Date.now();
  put({id:uid(), t:"feed", s:now, e:null, d:{m:"breast", first:side, side, l:0, r:0, ss:now}});
  toast(`Maitinimas pradėtas · ${SIDE[side]} krūtis`);
}
function switchSide(e){
  const now = Date.now(), d = e.d;
  if(paused(e)){ d.side = d.side==="L" ? "R" : "L"; put(e); return; }
  if(d.side==="L") d.l = (+d.l||0) + (now - d.ss); else d.r = (+d.r||0) + (now - d.ss);
  d.side = d.side==="L" ? "R" : "L"; d.ss = now; put(e);
}
function accSide(e, now){ // fold the running side's time into l/r
  if(e.t==="feed" && e.d?.m==="breast" && e.d.ss){
    if(e.d.side==="L") e.d.l = (+e.d.l||0) + (now - e.d.ss); else e.d.r = (+e.d.r||0) + (now - e.d.ss);
    delete e.d.ss;
  }
}
function stopEntry(e){
  const now = Date.now();
  if(paused(e)){ e.e = e.d.p; delete e.d.p; }   // stopped during a pause → it ended when the pause began
  else { accSide(e, now); e.e = now; }
  put(e); return e;
}
function pauseEntry(e){ if(paused(e)) return; const now = Date.now(); accSide(e, now); e.d.p = now; put(e);
  toast(e.t==="sleep" ? "Pauzė – jei vėl užmigs, spauskite „Vėl užmigo“" : "Pauzė"); }
function resumeEntry(e){ if(!paused(e)) return; const now = Date.now(); e.d.pl = (e.d.pl||[]).concat([[e.d.p, now]]); delete e.d.p;
  if(e.t==="feed" && e.d.m==="breast") e.d.ss = now; put(e); }
function startSleep(at, k){
  put({id:uid(), t:"sleep", s:at||Date.now(), e:null, d:{k}});
  toast("Saldžių sapnų 🌙");
}

  }
  if(e.t==="feed" && d.m==="solid") f += `<label class="f">Ką valgė</label><input class="in" id="xFood" placeholder="pvz. moliūgų tyrelė" value="${esc(d.food)}">`;
  if(e.t==="sleep") f += `<label class="f">Miego tipas</label><div class="seg" id="xK"><button data-v="nap" class="${d.k!=="night"?"on":""}">Pogulis</button><button data-v="night" class="${d.k==="night"?"on":""}">Nakties miegas</button></div>`;
  if(e.t==="pump") f += `<div class="two"><div><label class="f">Kairė, ml</label><input class="in" id="xPL" type="number" inputmode="numeric" value="${esc(d.l)}"></div>
      <div><label class="f">Dešinė, ml</label><input class="in" id="xPR" type="number" inputmode="numeric" value="${esc(d.r)}"></div></div>`;
  if(e.t==="weight") f += `<label class="f">Svoris, g</label><input class="in" id="xG" type="number" inputmode="numeric" placeholder="pvz. 6250" value="${esc(d.g)}">
    <div class="two"><div><label class="f">Ūgis, cm</label><input class="in" id="xH" type="number" inputmode="decimal" step="0.1" value="${esc(d.h)}"></div>
    <div><label class="f">Galvos apimtis, cm</label><input class="in" id="xHc" type="number" inputmode="decimal" step="0.1" value="${esc(d.hc)}"></div></div>`;
  if(e.t==="vaccine") f += `<label class="f">Skiepas</label><input class="in" id="xVn" list="vacList" placeholder="pvz. 6-valentė, pneumokokinė, rotavirusinė" value="${esc(d.name)}">
    <datalist id="vacList">${["6-valentė (DTaP-IPV-Hib-HepB)","Pneumokokinė (PCV)","Rotavirusinė","Meningokokinė B","Meningokokinė ACWY","Tymų, epideminio parotito, raudonukės (MMR)","Vėjaraupių","Gripo","Erkinio encefalito","Hepatito B","Tuberkuliozės (BCG)"].map(v=>`<option value="${v}">`).join("")}</datalist>`;
  if(e.t==="diaper") f += `<label class="chk"><input type="checkbox" id="xW" ${d.w?"checked":""}> 💧 Šlapios</label><label class="chk"><input type="checkbox" id="xP" ${d.p?"checked":""}> 💩 Purvinos</label>`;

  const point = ["diaper","bath","weight","vaccine"].includes(e.t) || (e.t==="feed" && d.m!=="breast");
  f += point ? `<label class="f">Laikas</label><input class="in" id="xS" type="datetime-local" value="${toInput(e.s)}">`
    : `<label class="f">Pradžia</label><input class="in" id="xS" type="datetime-local" value="${toInput(e.s)}">
       <label class="f">Pabaiga</label><input class="in" id="xE" type="datetime-local" value="${run?"":toInput(e.e)}" ${run?"disabled":""}>
       ${run?`<div class="muted small" style="margin-top:6px">Laikmatis vis dar veikia.</div>`:""}`;
  f += `<label class="f">Pastaba</label><input class="in" id="xN" placeholder="nebūtina" value="${esc(e.n)}">`;
  openSheet(`<h3>${title}</h3>${f}<div class="btns">${isNew?"":`<button class="btn del" id="xDel">Ištrinti</button>`}<button class="btn" id="xCancel">Atšaukti</button><button class="btn pri" id="xSave">Išsaugoti</button></div>`);
  const sheet = $("#sheet");
  sheet.onclick = ev => { const b = ev.target.closest(".seg button"); if(!b) return; b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    if(b.parentNode.id==="xMilk"){ const m = b.dataset.v==="mix"; $("#xOne").classList.toggle("hide", m); $("#xTwo").classList.toggle("hide", !m); } };
  const segv = id => sheet.querySelector(`#${id} .on`)?.dataset.v;
  $("#xCancel").onclick = closeSheet;
  if($("#xDel")) $("#xDel").onclick = () => { closeSheet(); remove(entries[e.id] || e); };
  $("#xSave").onclick = () => {
    const s = fromInput($("#xS").value); if(!s){ $("#xS").focus(); return; }
    e.s = s;
    if(point) e.e = s; else if(!run){ const en = fromInput($("#xE").value); e.e = en && en > s ? en : s; }
    if(e.t==="feed" && d.m==="breast"){ d.first = segv("xFirst") || d.first; if(!run){ d.l = (+$("#xL").value||0)*MIN; d.r = (+$("#xR").value||0)*MIN; d.side = d.r && !d.l ? "R" : d.l && !d.r ? "L" : d.side; } }
    if(e.t==="feed" && d.m==="bottle"){ d.milk = segv("xMilk");
      if(d.milk==="mix"){ d.bm = +$("#xBm").value||0; d.fm = +$("#xFm").value||0; d.ml = d.bm + d.fm || ""; }
      else { d.ml = +$("#xMl").value || ""; delete d.bm; delete d.fm; } }
    if(e.t==="feed" && d.m==="solid") d.food = $("#xFood").value.trim();
    if(e.t==="sleep") d.k = segv("xK");
    if(e.t==="pump"){ d.l = +$("#xPL").value || ""; d.r = +$("#xPR").value || ""; }
    if(e.t==="diaper"){ d.w = $("#xW").checked; d.p = $("#xP").checked; }
    if(e.t==="weight"){ d.g = +$("#xG").value||""; d.h = +String($("#xH").value).replace(",",".")||""; d.hc = +String($("#xHc").value).replace(",",".")||""; if(!d.g && !d.h && !d.hc){ $("#xG").focus(); return; } }
    if(e.t==="vaccine") d.name = $("#xVn").value.trim();
    e.n = $("#xN").value.trim();
    if(d.pl){ const end = e.e ?? Date.now(); d.pl = d.pl.map(([a,b])=>[Math.max(a,e.s), Math.min(b,end)]).filter(([a,b])=>b>a); }
    closeSheet(); put(e); toast("Išsaugota");
  };
}

/* ---------- settings ---------- */
function pairLink(){ return location.origin + location.pathname + "#pair=" + btoa(unescape(encodeURIComponent(JSON.stringify({u:cfg.url,k:cfg.key})))); }
function settingsSheet(){
  const b = baby();
  openSheet(`<h3>Nustatymai</h3>
    <div class="two"><div><label class="f">Vardas</label><input class="in" id="sName" value="${esc(b.name)}"></div>
    <div><label class="f">Gimimo data</label><input class="in" id="sBirth" type="date" value="${esc(b.birth)}"></div></div>
    <label class="f">Šį telefoną naudoja</label><div class="seg" id="sWho"><button data-v="Mama" class="${who==="Mama"?"on":""}">Mama</button><button data-v="Tėtis" class="${who==="Tėtis"?"on":""}">Tėtis</button></div>
    <label class="f">Tema</label><div class="seg" id="sTheme"><button data-v="auto" class="${theme==="auto"?"on":""}">Automatinė</button><button data-v="light" class="${theme==="light"?"on":""}">Šviesi</button><button data-v="dark" class="${theme==="dark"?"on":""}">Tamsi</button></div>
    <h3 style="margin-top:22px">Sinchronizacija</h3>
    <div class="muted small">${cfg.url ? `Įjungta. ${syncState==="err"?"⚠︎ Paskutinis bandymas nepavyko.":"Duomenys bendri abiem telefonams."}` : "Kol kas duomenys saugomi tik šiame telefone."}</div>
    <label class="f">Serverio adresas (Apps Script URL)</label><input class="in" id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.url)}">
    <label class="f">Raktas</label><input class="in" id="sKey" value="${esc(cfg.key)}">
    ${cfg.url?`<div class="btns"><button class="btn" id="sShare">🔗 Bendrinti su partneriu</button></div>
      <div class="muted small" style="margin-top:6px">Atsiųskite šią nuorodą antram telefonui – ją atidarius sinchronizacija įsijungs automatiškai.</div>`:""}
    <div class="btns"><button class="btn" id="sExport">⬇ Atsisiųsti duomenis</button><button class="btn" id="sImport">⬆ Importuoti</button></div>
    <input type="file" id="sFile" accept=".json,application/json" class="hide">
    <div class="btns"><button class="btn" id="sCancel">Uždaryti</button><button class="btn pri" id="sSave">Išsaugoti</button></div>
    <p class="disc">Liepa v1 · ${Object.keys(entries).length} įrašų šiame telefone</p>`);
  const sheet = $("#sheet");
  sheet.onclick = ev => { const b = ev.target.closest(".seg button"); if(!b) return; b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); };
  $("#sCancel").onclick = closeSheet;
  if($("#sShare")) $("#sShare").onclick = async () => { const url = pairLink();
    try{ if(navigator.share){ await navigator.share({title:"Liepa", text:"Atidaryk šią nuorodą – mūsų Liepos programėlė susisinchronizuos:", url}); return; } }catch(e){ return; }
    try{ await navigator.clipboard.writeText(url); toast("Nuoroda nukopijuota"); }catch(e){ prompt("Nukopijuokite nuorodą:", url); } };
  $("#sExport").onclick = () => { const blob = new Blob([JSON.stringify(Object.values(entries),null,1)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `liepa-${toInput(Date.now()).slice(0,10)}.json`; a.click(); };
  $("#sImport").onclick = () => $("#sFile").click();
  $("#sFile").onchange = async ev => { const f = ev.target.files[0]; if(!f) return;
    try{ const arr = JSON.parse(await f.text()); if(!Array.isArray(arr)) throw 0;
      let n = 0; for(const it of arr){ if(!it || !it.id || !it.t || !it.s) continue; const cur = entries[it.id];
        if(!cur || (it.u||0) > (cur.u||0)){ entries[it.id] = it; if(!queue.includes(it.id)) queue.push(it.id); n++; } }
      saveLocal(); closeSheet(); toast(`Importuota ${n} ${pl(n,["įrašas","įrašai","įrašų"])}`); sync();
    }catch(e){ toast("Nepavyko nuskaityti failo"); } };
  $("#sSave").onclick = () => {
    const name = $("#sName").value.trim() || "Liepa", birth = $("#sBirth").value || DEFAULT_BABY.birth;
    const cur = baby(); if(name!==cur.name || birth!==cur.birth || !entries.cfg) put({id:"cfg", t:"cfg", s:0, e:0, d:{name, birth}});
    who = sheet.querySelector("#sWho .on")?.dataset.v || who; LS.set("lp_who", who);
    theme = sheet.querySelector("#sTheme .on")?.dataset.v || "auto"; LS.set("lp_theme", theme);
    const url = $("#sUrl").value.trim(), key = $("#sKey").value.trim();
    if(url!==cfg.url || key!==cfg.key){ cfg = {url, key}; LS.set("lp_cfg", cfg); since = 0; LS.set("lp_since", 0); queue = Object.keys(entries); saveLocal(); }
    closeSheet(); sync(true);
  };
}
function whoSheet(){
  openSheet(`<h3>Sveiki! 👋</h3><p>Kas naudos šį telefoną? Tai padės matyti, kas pažymėjo įrašą.</p>
    <div class="big-opts"><button class="opt" data-w="Mama">👩 Mama</button><button class="opt" data-w="Tėtis">👨 Tėtis</button></div>`);
  $("#sheet").onclick = ev => { const b = ev.target.closest("[data-w]"); if(!b) return; who = b.dataset.w; LS.set("lp_who", who); closeSheet(); };
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, btn, fn){
  $("#toastTxt").textContent = msg; const b = $("#toastBtn");
  b.textContent = btn || ""; b.classList.toggle("hide", !btn); b.onclick = () => { $("#toast").classList.remove("show"); fn && fn(); };
  $("#toast").classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>$("#toast").classList.remove("show"), btn?5000:2200);
}

/* ---------- event wiring ---------- */
document.addEventListener("click", ev => {
  const q = ev.target.closest("[data-q]");
  if(q){ const t = q.dataset.q;
    if(t==="feed") feedSheet();
    if(t==="sleep") sleepSheet();
    if(t==="pump"){ const p = running().find(e=>e.t==="pump"); if(p){ stopEntry(p); editSheet(p); } else pumpSheet(); }
    if(t==="diaper") diaperSheet();
    return; }
  const act = ev.target.closest("[data-act]");
  if(act){ const e = entries[act.closest("[data-id]").dataset.id]; if(!e) return; const a = act.dataset.act;
    if(a==="stop"){ stopEntry(e);
      if(e.t==="pump") editSheet(e);
      else if(e.t==="feed"){ const bt = breastTimes(e); toast(`Maitinimas: ${dur(bt.tot)}${bt.l&&bt.r?` (K ${dur(bt.l)}, D ${dur(bt.r)})`:""}`); }
      else toast(`Miegojo ${dur(activeMs(e))}`); }
    if(a==="pause") pauseEntry(e);
    if(a==="resume") resumeEntry(e);
    if(a==="switch") switchSide(e);
    if(a==="edit") editSheet(e);
    return; }
  const ed = ev.target.closest("[data-edit]"); if(ed){ editSheet(entries[ed.dataset.edit]); return; }
  const dd = ev.target.closest("[data-day]"); if(dd){ histDay = addDays(histDay, +dd.dataset.day); if(histDay>dayStart(Date.now())) histDay = dayStart(Date.now()); render(); return; }
  if(ev.target.closest("[data-add]")){ addSheet(); return; }
  const nw = ev.target.closest("[data-new]"); if(nw){ const t = nw.dataset.new;
    editSheet({id:uid(), t, s:Date.now(), e:Date.now(), d: t==="weight"?{g:"",h:"",hc:""} : t==="vaccine"?{name:""} : {}}, true); return; }
  const g = ev.target.closest("[data-goto]"); if(g){ go(g.dataset.goto); return; }
  const n = ev.target.closest("nav [data-pg]"); if(n){ go(n.dataset.pg); return; }
});
$("#setBtn").onclick = settingsSheet;
function go(p){ page = p; document.querySelectorAll("main").forEach(m=>m.classList.toggle("hide", m.id!=="pg-"+p));
  document.querySelectorAll("nav [data-pg]").forEach(b=>b.classList.toggle("on", b.dataset.pg===p));
  if(p==="hist") histDay = dayStart(Date.now()); render(); scrollTo(0,0); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

/* =========================================================
   Sync (Google Sheet via Apps Script)
   ========================================================= */
let syncing = false, syncState = "", again = false;
function setSync(s){ syncState = s; $("#syncDot").className = "sync " + (cfg.url ? s : ""); }
async function sync(){
  if(!cfg.url) return;
  if(syncing){ again = true; return; }
  syncing = true; setSync("busy");
  try{
    const ids = queue.slice(); const items = ids.map(id=>entries[id]).filter(Boolean);
    const res = await fetch(cfg.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({key:cfg.key, items, since})});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||"error");
    queue = queue.filter(id => !ids.includes(id) || (entries[id] && entries[id].u > (items.find(x=>x.id===id)?.u||0)));
    let changed = false;
    for(const it of j.items||[]){
      if(queue.includes(it.id)) continue;                 // local edit pending wins
      const cur = entries[it.id];
      if(!cur || (it.u||0) >= (cur.u||0)){ if(JSON.stringify(cur)!==JSON.stringify(it)){ entries[it.id] = it; changed = true; } }
    }
    since = j.now; LS.set("lp_since", since); saveLocal(); setSync("ok");
    if(changed && !$("#scrim").classList.contains("show")) render();
  }catch(err){
    setSync("err");
    if(String(err.message)==="unauthorized") toast("Neteisingas sinchronizacijos raktas");
  }finally{
    syncing = false; if(again){ again = false; setTimeout(sync, 300); }
  }
}
setInterval(() => { if(document.visibilityState==="visible") sync(); }, 15000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible"){ sync(); render(); } });
addEventListener("online", sync);

/* =========================================================
   Boot
   ========================================================= */
function pairFromHash(){
  const m = location.hash.match(/pair=([^&]+)/); if(!m) return false;
  try{ const p = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(p.u){ cfg = {url:p.u, key:p.k||""}; LS.set("lp_cfg", cfg); since = 0; LS.set("lp_since",0); queue = Object.keys(entries); saveLocal(); setTimeout(()=>toast("Sinchronizacija įjungta ✓"), 600); } }catch(e){}
  history.replaceState(null, "", location.pathname); return true;
}
addEventListener("hashchange", () => { if(pairFromHash()){ render(); sync(); } });
(function boot(){
  pairFromHash();
  render(); setSync(""); sync();
  if(!who) setTimeout(whoSheet, 400);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
